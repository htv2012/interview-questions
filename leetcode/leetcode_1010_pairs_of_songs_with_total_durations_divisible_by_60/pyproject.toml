[project]
name = "leetcode-1010"
version = "0.1.0"
description = "Pairs of Songs With Total Durations Divisible by 60"
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = [
    "pudb>=2025.1.5",
    "pytest>=9.1.1",
    "ruff>=0.16.5",
    "ty>=0.0.78",
]

[tool.pytest.ini_options]
pythonpath = [".", "../../_common"]

log_cli = true
log_cli_level = "WARNING"
log_file = "/tmp/leetcode-1010.log"
log_file_level = "DEBUG"
