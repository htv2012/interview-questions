[project]
name = "leetcode-0142"
version = "0.1.0"
description = "Linked List Cycle II"
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = [
    "pudb>=2025.1.5",
    "pytest>=9.1.1",
    "ruff>=0.16.4",
    "ty>=0.0.73",
]

[tool.pytest.ini_options]
pythonpath = [".", "../../_common"]

log_cli = false
log_cli_level = "WARNING"
log_file = "/tmp/leetcode-0142.log"
log_file_level = "DEBUG"
