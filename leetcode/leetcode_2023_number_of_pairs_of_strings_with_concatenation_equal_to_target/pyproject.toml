[project]
name = "leetcode-2023"
version = "0.1.0"
description = "Number of Pairs of Strings With Concatenation Equal to Target"
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = [
    "pudb>=2025.1.5",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
    "ty>=0.0.83",
]

[tool.pytest.ini_options]
pythonpath = [".", "../../_common"]

log_cli = true
log_cli_level = "WARNING"
log_file = "/tmp/leetcode-2023.log"
log_file_level = "DEBUG"
