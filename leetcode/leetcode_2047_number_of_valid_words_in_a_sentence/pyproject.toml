[project]
name = "leetcode-2047"
version = "0.1.0"
description = "Number of Valid Words in a Sentence"
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = [
    "pudb>=2025.1.5",
    "pytest>=9.1.1",
    "ruff>=0.16.5",
    "ty>=0.0.77",
]

[tool.pytest.ini_options]
pythonpath = [".", "../../_common"]

log_cli = true
log_cli_level = "DEBUG"
log_file = "/tmp/leetcode-2047.log"
log_file_level = "DEBUG"
